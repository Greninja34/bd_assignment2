# =====================================================================
#  broker2.properties  -  VM3  -  BROKER 2  (node 2, broker ONLY)
# =====================================================================
#  Install on VM3 as:   /opt/kafka/config/kraft/a2-broker2.properties
#  Before use, replace <VM2_IP> and <VM3_IP> with the ZeroTier IPs:
#       sed -i -e 's/<VM2_IP>/10.147.17.21/g' -e 's/<VM3_IP>/10.147.17.33/g' \
#           /opt/kafka/config/kraft/a2-broker2.properties
#  Every property is explained in 04-CONCEPTS-GUIDE.md, section "Kafka config".
# =====================================================================

# --- identity & roles ------------------------------------------------
# Broker only: stores topic data, but is NOT part of the controller quorum.
process.roles=broker
node.id=2
# Where the (only) controller lives: VM2, controller port 9093.
controller.quorum.voters=1@<VM2_IP>:9093

# --- network ---------------------------------------------------------
# VM3 has no CONTROLLER listener of its own (it is not a controller).
listeners=PLAINTEXT://0.0.0.0:9092
# Clients and VM2 must reach VM3 at ITS OWN ZeroTier IP.
advertised.listeners=PLAINTEXT://<VM3_IP>:9092
inter.broker.listener.name=PLAINTEXT
# The name of the listener VM3 uses to talk TO the controller on VM2.
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# --- storage ---------------------------------------------------------
log.dirs=/opt/kafka/data/kraft

# --- topic defaults: same as VM2 -------------------------------------
num.partitions=2
default.replication.factor=2
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
