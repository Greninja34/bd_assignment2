# =====================================================================
#  broker1.properties  -  VM2  -  KRaft CONTROLLER + BROKER 1  (node 1)
# =====================================================================
#  Install on VM2 as:   /opt/kafka/config/kraft/a2-broker1.properties
#  Before use, replace <VM2_IP> (3 places) with VM2's ZeroTier IP:
#       sed -i 's/<VM2_IP>/10.147.17.21/g' /opt/kafka/config/kraft/a2-broker1.properties
#  Every property is explained in 04-CONCEPTS-GUIDE.md, section "Kafka config".
# =====================================================================

# --- identity & roles ------------------------------------------------
# This one process plays BOTH roles: it stores topic data (broker) and it
# runs the KRaft metadata quorum (controller).  "Combined mode".
process.roles=broker,controller
# Unique number of this node in the cluster. VM3 will use 2.
node.id=1
# Who is in the controller quorum:  <node.id>@<host>:<controller port>.
# Only ONE voter (VM2) -> a quorum of one. Every node, including VM3,
# must be told the same list so it knows where the controller is.
controller.quorum.voters=1@<VM2_IP>:9093

# --- network ---------------------------------------------------------
# What this process BINDS to. 0.0.0.0 = accept connections on every
# interface (needed so connections arriving on the ZeroTier interface work).
#   9092 = client + broker traffic     9093 = controller (Raft) traffic
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
# What this broker TELLS CLIENTS to connect to after the first contact.
# Must be an address clients can reach -> the ZeroTier IP, never localhost.
advertised.listeners=PLAINTEXT://<VM2_IP>:9092
# Which listener brokers use to talk to each other.
inter.broker.listener.name=PLAINTEXT
# Which listener name is the controller's.
controller.listener.names=CONTROLLER
# Listener name -> security protocol (no encryption/auth in this lab).
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# --- storage ---------------------------------------------------------
# Where partition data and the metadata log live. NOT /tmp (cleared on reboot).
log.dirs=/opt/kafka/data/kraft

# --- topic defaults: 2 partitions, replication factor 2 ---------------
num.partitions=2
default.replication.factor=2
# Kafka's internal topics (consumer offsets, transactions) also need
# replication 2, otherwise losing VM3 could take them down with it.
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
# A write with acks=all succeeds as long as at least 1 replica is in sync.
# This is what lets writes continue while VM3 is down.
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
# Topics are created explicitly by us, never by accident.
auto.create.topics.enable=false
