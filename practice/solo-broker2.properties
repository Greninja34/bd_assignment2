# =====================================================================
#  SOLO PRACTICE - broker 2 (broker only), on 127.0.0.1
#  Same file as the team's broker2.properties, minus the ZeroTier IPs.
#  Port 9094 for clients, because broker 1 already owns 9092 on this machine.
# =====================================================================
process.roles=broker
node.id=2
controller.quorum.voters=1@127.0.0.1:9093

listeners=PLAINTEXT://0.0.0.0:9094
advertised.listeners=PLAINTEXT://127.0.0.1:9094
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

log.dirs=/tmp/a2-practice/kraft-2

num.partitions=2
default.replication.factor=2
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
