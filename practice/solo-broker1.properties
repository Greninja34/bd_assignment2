# =====================================================================
#  SOLO PRACTICE - broker 1 + controller, everything on 127.0.0.1
#  Same file as the team's broker1.properties, minus the ZeroTier IPs.
#  Ports: 9092 (clients), 9093 (controller).
# =====================================================================
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093

listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://127.0.0.1:9092
inter.broker.listener.name=PLAINTEXT
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# /tmp is fine for practice (and a handy way to see why production never uses it)
log.dirs=/tmp/a2-practice/kraft-1

num.partitions=2
default.replication.factor=2
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
min.insync.replicas=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
